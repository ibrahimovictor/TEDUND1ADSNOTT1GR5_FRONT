<div class="tabela-wrapper">
    <table mat-table [dataSource]="dataSource" matSort>
        
        <!-- Gera colunas dinamicamente -->
        @for (column of columns(); track column.key) {
        <ng-container [matColumnDef]="column.key">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> 
            {{ column.label }}
            </th>
            <td mat-cell *matCellDef="let row"> 
            {{ formatValue(row[column.key], column, row) }}
            </td>
        </ng-container>
        }

         <!-- Coluna de ações dinâmica -->
        @if (showActions()) {
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> 
                    {{ actionsLabel() }}
                </th>
                <td mat-cell *matCellDef="let row"> 
                    <ng-container 
                        *ngTemplateOutlet="actionsTemplate; context: { $implicit: row }"
                    ></ng-container>
                </td>
            </ng-container>
        }

        <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns();" 
            (click)="onRowClick(row)"></tr>

        <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns().length">
            Nenhum resultado encontrado
        </td>
        </tr>
    </table>
</div>
<mat-paginator [pageSize]="pageSize()" [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Selecione a página"></mat-paginator>
