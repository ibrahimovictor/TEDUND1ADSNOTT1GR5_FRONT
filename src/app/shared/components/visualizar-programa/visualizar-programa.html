<div class="detalhes-wrapper">
  <div class="header">
    <h2>Informações do Programa</h2>
  </div>
  <div class="content">
    <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start">
      <mat-tab label="Programa">
        <div class="form-programa-wrapper">
          <form class="form-programa" [formGroup]="formPrograma">
            <div class="input-z1">
            <mat-form-field class="input-disciplina" appearance="fill">
              <mat-label>Disciplina (ID)</mat-label>
              <input readonly [formControl]="disciplinaIdControl" type="text" matInput name="disciplinaId" placeholder="ID da disciplina">
            </mat-form-field>
            <mat-form-field class="input-matriz">
              <mat-label>Matriz</mat-label>
              <mat-select [formControl]="matrizIdControl">
                @for (matriz of matrizesPossiveis(); track matriz) {
                  <mat-option [value]="matriz.id">{{matriz.nomeCurso + ' - ' + matriz.campus}}</mat-option>
                }
              </mat-select>
            </mat-form-field>

            <section class="ativo-section">
              <mat-checkbox [formControl]="ativoControl" class="ativo">Ativo</mat-checkbox>
            </section>
          </div>
          <mat-form-field class="input-ementa">
                <mat-label>Ementa</mat-label>
                <textarea
                  [formControl]="ementaControl"
                  matInput name="ementa"
                  placeholder="Descreva a ementa do programa aqui..."
                  rows="3"
                  cdkTextareaAutosize
                  #autosize="cdkTextareaAutosize"
                  cdkAutosizeMinRows="2"
                  cdkAutosizeMaxRows="3"></textarea>
            </mat-form-field>
            <mat-form-field class="input-objetivos">
                <mat-label>Objetivos</mat-label>
                <textarea
                  [formControl]="objetivosControl"
                  matInput name="objetivos"
                  placeholder="Descreva os objetivos do programa aqui..."
                  rows="3"
                  cdkTextareaAutosize
                  #autosize="cdkTextareaAutosize"
                  cdkAutosizeMinRows="2"
                  cdkAutosizeMaxRows="3"></textarea>
            </mat-form-field>
            <mat-form-field class="input-conteudo">
                <mat-label>Conteúdo</mat-label>
                <textarea
                  [formControl]="conteudoProgramaticoControl"
                  matInput
                  name="conteudo"
                  placeholder="Descreva o conteúdo do programa aqui... (uma linha por item)"
                  rows="3"
                  cdkTextareaAutosize
                  #autosize="cdkTextareaAutosize"
                  cdkAutosizeMinRows="2"
                  cdkAutosizeMaxRows="3"></textarea>
            </mat-form-field>
            <mat-form-field class="input-metodologia">
                <mat-label>Metodologia</mat-label>
                <textarea
                  [formControl]="metodologiaControl"
                  matInput
                  name="metodologia"
                  placeholder="Descreva a metodologia do programa aqui..."
                  rows="3"
                  cdkTextareaAutosize
                  #autosize="cdkTextareaAutosize"
                  cdkAutosizeMinRows="2"
                  cdkAutosizeMaxRows="3"></textarea>
            </mat-form-field>
            <mat-form-field class="input-avaliacao">
                <mat-label>Avaliação</mat-label>
                <textarea
                  [formControl]="sistemaAvaliacaoControl"
                  matInput
                  name="avaliacao"
                  placeholder="Descreva os critérios de avaliação do programa aqui..."
                  rows="3"
                  cdkTextareaAutosize
                  #autosize="cdkTextareaAutosize"
                  cdkAutosizeMinRows="2"
                  cdkAutosizeMaxRows="3"></textarea>
            </mat-form-field>

            <mat-form-field class="input-observacoes input">
              <mat-label>Observações da Alteração</mat-label>
              <textarea
                matInput
                name="observacoesAlteracao"
                placeholder="Adicione observações sobre a alteração referência aqui..."
                rows="3"
                cdkTextareaAutosize
                #autosize="cdkTextareaAutosize"
                cdkAutosizeMinRows="2"
                cdkAutosizeMaxRows="3"
                [formControl]="observacoesAlteracaoControl"></textarea>
            </mat-form-field>
          </form>

          <div class="action-buttons">
            @if(this.role() == UserRole.ADMIN) {
              <button matButton="filled" class="btn-apagar" (click)="openConfirmDeleteDialog()">Apagar</button>
            }
              <button matButton="filled" [disabled]="!formPrograma.valid" (click)="onSubmit()">Salvar</button>
          </div>
        </div>
      </mat-tab>

      <mat-tab label="Referências">
        <app-tabela-referencias [programa]="programa()"></app-tabela-referencias>
      </mat-tab>

      <mat-tab label="Histórico de Alterações">
        <app-historico-alteracoes [idPrgrama]="programa()?.id ?? null"></app-historico-alteracoes>
      </mat-tab>
    </mat-tab-group>
  </div>
</div>
