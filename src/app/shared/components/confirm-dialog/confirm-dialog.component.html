<div class="confirm-dialog">
    <div class="confirm-dialog-header">
        <h2 mat-dialog-title>{{ data.title || 'Confirmação' }}</h2>
    </div>
    <div class="confirm-dialog-content" mat-dialog-content>
        <p>{{ data.message }}</p>
    </div>
    <div class="confirm-dialog-actions" mat-dialog-actions align="end">
        <button mat-button (click)="onCancel()">{{ data.cancelLabel || 'Cancelar' }}</button>
        <button mat-raised-button color="primary" (click)="onConfirm()">{{ data.confirmLabel || 'Confirmar' }}</button>
    </div>
</div>
