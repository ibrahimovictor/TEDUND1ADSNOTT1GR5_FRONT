<div class="header">
    <h2>Dados do Usuário</h2>
    <hr>
</div>
<div class="content">
    <form class="form-usuario" [formGroup]="usuarioForm">
        <input type="hidden" formControlName="idUsuario">

        <mat-form-field class="input input-nome-completo">
            <mat-label>Nome Completo</mat-label>
            <input matInput formControlName="nome" required placeholder="Informe o nome">
        </mat-form-field>

        <mat-form-field class="input input-usuario">
            <mat-label>Usuário</mat-label>
            <input matInput formControlName="usuario" required placeholder="Informe o nome de usuário">
        </mat-form-field>

        <mat-form-field class="input input-senha">
            <mat-label>Senha</mat-label>
            <input matInput type="password" formControlName="senha" required placeholder="Informe a senha">
        </mat-form-field>

        <mat-form-field class="input input-perfil">
            <mat-label>Perfil</mat-label>
            <mat-select formControlName="perfil" required (selectionChange)="perfilEscolhido.set($event.value)">
                @for(perfil of possiveisPerfis; track perfil){
                  <mat-option [value]="perfil.value">{{ perfil.label }}</mat-option>
                }
            </mat-select>
        </mat-form-field>

        @if(perfilEscolhido() === UserRole.PROFESSOR) {
          <section class="section-professor clearfix">
            <div class="header-info-professos">
              <h3>Informações do Professor</h3>
            </div>
            <input type="hidden" formControlName="idProfessor">
            <mat-form-field class="input input-numero-registro">
                <mat-label>Número de Registro</mat-label>
                <input matInput type="text" formControlName="numeroRegistro" placeholder="Informe o número de registro">
            </mat-form-field>
            <mat-form-field class="input input-escola">
                <mat-label>Escola</mat-label>
                <mat-select formControlName="escola" required>
                    @for(escola of possiveisEscolas(); track escola){
                      <mat-option [value]="escola.id">{{ escola.nome }}</mat-option>
                    }
                </mat-select>
            </mat-form-field>
            <section class="input input-ativo">
              <mat-checkbox formControlName="ativo">Ativo</mat-checkbox>
            </section>
          </section>
        }
    </form>

    <div class="action-buttons">
        <button mat-button mat-dialog-close>Cancelar</button>
        <button matButton="filled" [disabled]="!usuarioForm.valid" (click)="onSubmit()">Salvar</button>
    </div>
</div>
