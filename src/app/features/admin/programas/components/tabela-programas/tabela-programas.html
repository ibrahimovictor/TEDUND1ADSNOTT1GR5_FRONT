<app-dynamic-table
  [data]="data()"
  [filter]="filter"
  [columns]="tableColumns"
  [showActions]="true">

  <!-- Template de ações -->
  <ng-template #actionsTemplate let-row>
    <button mat-icon-button color="primary" (click)="$event.stopPropagation(); openProgramaDetalhes(row)" matTooltip="Visualizar">
      <mat-icon>visibility</mat-icon>
    </button>
  </ng-template>
</app-dynamic-table>
