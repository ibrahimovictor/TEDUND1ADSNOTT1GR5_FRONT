<div class="header">
  <h1>Disciplinas</h1>
</div>

<div class="content">
  <div class="actions">
    <mat-form-field class="search">
      <mat-label>Pesquisar</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Ex. POOA" #input>
      <mat-icon matPrefix>search</mat-icon>
    </mat-form-field>

    <div class="action-buttons">
      <button matButton="filled" class="btn-novo" (click)="openNovaDisciplinaDialog()">
        Novo
        <mat-icon>add</mat-icon>
      </button>
    </div>
  </div>
  <hr>
  <app-tabela-disciplinas [filter]="filterText()"></app-tabela-disciplinas>
</div>
