<div class="header">
  <h2 matDialogTitle>Dados da Disciplina</h2>
  <hr>
</div>
<div class="content">
  <div class="form-disciplinas-wrapper">
    <form class="form-disciplina" [formGroup]="formDisciplina">
      <mat-form-field  class="input-sigla">
        <mat-label>Sigla</mat-label>
        <input matInput [formControl]="siglaControl" type="text" name="sigla" placeholder="Ex. MAT01"/>
      </mat-form-field>

      <mat-form-field class="input-nome">
        <mat-label>Descrição</mat-label>
        <input [formControl]="descricaoControl" matInput name="descricao" placeholder="Ex. Matemática Básica"/>
      </mat-form-field>

      <mat-form-field class="input-carga-horaria">
        <mat-label>Carga Horária</mat-label>
        <input [formControl]="cargaHorariaControl" matInput type="number" name="cargaHoraria" placeholder="Ex. 70"/>
      </mat-form-field>

      <div class="input-tipo-wrapper">
        <label for="tipo-radio-button">Tipo</label>
        <mat-radio-group id="tipo-radio-button" name="tipo-radio-button" [formControl]="tipoControl" aria-labelledby="tipo-radio-button" class="tipo-radio-button-group">
          @for (tipo of tiposDisciplina; track tipo){
            <mat-radio-button class="tipo-radio-button" [value]="tipo">{{ tipo }}</mat-radio-button>
          }
        </mat-radio-group>
      </div>

      <div class="input-classificacao-wrapper">
        <label for="classificacao-radio-button">Classificação</label>
        <mat-radio-group id="classificacao-radio-button" name="classificacao-radio-button" [formControl]="classificacaoControl" aria-labelledby="classificacao-radio-button" class="classificacao-radio-button-group">
          @for (classificacao of classifacoesDisciplina; track classificacao){
            <mat-radio-button class="classificacao-radio-button" [value]="classificacao">{{ classificacao }}</mat-radio-button>
          }
        </mat-radio-group>

      </div>
    </form>

    <div class="action-buttons">
      <button matButton matDialogClose>Cancelar</button>
      <button matButton="filled" (click)="onSubmit()">Salvar</button>
    </div>
  </div>
</div>
