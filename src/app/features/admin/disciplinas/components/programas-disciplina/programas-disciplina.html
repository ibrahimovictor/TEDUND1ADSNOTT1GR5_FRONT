<div class="header">
  <h2>Programas da Disciplina</h2>
  <hr>
</div>
<div class="content">
  <div class="actions">
    <div class="action-buttons">
      <button matButton="filled" class="btn-novo" (click)="openNovoProgramaDialog()">
        Novo
        <mat-icon>add</mat-icon>
      </button>
    </div>
  </div>
 
  
  <app-dynamic-table
    [data]="programasDataMontado()"
    [columns]="tableColumns"
    [showActions]="true">

    <!-- Template de ações -->
    <ng-template #actionsTemplate let-row>
      <button mat-icon-button (click)="$event.stopPropagation(); openProgramaDetalhes(row)" matTooltip="Visualizar">
        <mat-icon>visibility</mat-icon>
      </button>
      <button mat-icon-button (click)="$event.stopPropagation(); openConfirmDeleteDialog(row)" matTooltip="Excluir">
        <mat-icon>delete</mat-icon>
      </button>
    </ng-template>
  </app-dynamic-table>
</div>
