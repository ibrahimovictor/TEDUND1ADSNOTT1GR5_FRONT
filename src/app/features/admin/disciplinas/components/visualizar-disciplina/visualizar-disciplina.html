<div class="detalhes-wrapper">
  <div class="header">
    <h2>Informações da Disciplina</h2>
  </div>
  <div class="content">
    <hr>
    <div class="form-disciplinas-wrapper">
      <form class="form-disciplina" [formGroup]="formDisciplina">
        <mat-form-field class="input-sigla input">
          <mat-label>Sigla</mat-label>
          <input matInput [formControl]="siglaControl" type="text" name="sigla" placeholder="Ex. MAT01"/>
        </mat-form-field>

        <mat-form-field class="input-nome input">
          <mat-label>Descrição</mat-label>
          <input [formControl]="descricaoControl" matInput name="descricao" placeholder="Ex. Matemática Básica"/>
        </mat-form-field>

        <section class="ativo-section input">
          <mat-checkbox [formControl]="ativaControl" class="ativo">Ativa</mat-checkbox>
        </section>

        <br class="clearfix">

        <mat-form-field class="input-carga-horaria input">
          <mat-label>Carga Horária</mat-label>
          <input [formControl]="cargaHorariaControl" matInput type="number" name="cargaHoraria" placeholder="Ex. 70"/>
        </mat-form-field>

        <div class="input-tipo-wrapper input">
          <label for="tipo-radio-button">Tipo</label>
          <mat-radio-group id="tipo-radio-button" name="tipo-radio-button" [formControl]="tipoControl"
                           aria-labelledby="tipo-radio-button" class="tipo-radio-button-group">
            @for (tipo of tiposDisciplina; track tipo) {
              <mat-radio-button class="tipo-radio-button" [value]="tipo">{{ tipo }}</mat-radio-button>
            }
          </mat-radio-group>
        </div>

        <div class="input-classificacao-wrapper input">
          <label for="classificacao-radio-button">Classificação</label>
          <mat-radio-group id="classificacao-radio-button" name="classificacao-radio-button"
                           [formControl]="classificacaoControl" aria-labelledby="classificacao-radio-button"
                           class="classificacao-radio-button-group">
            @for (classificacao of classifacoesDisciplina; track classificacao) {
              <mat-radio-button class="classificacao-radio-button" [value]="classificacao">{{ classificacao }}
              </mat-radio-button>
            }
          </mat-radio-group>
        </div>
      </form>

      <div class="action-buttons">
        <button matButton="filled" (click)="onSubmit()" [disabled]="!formDisciplina.valid">Salvar</button>
      </div>
    </div>

    <app-programas-disciplina [disciplina]="disciplina()"></app-programas-disciplina>
  </div>
</div>
