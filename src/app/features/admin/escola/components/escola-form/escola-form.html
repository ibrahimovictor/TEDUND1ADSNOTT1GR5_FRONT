<div class="header">
    <h2>Dados da Escola</h2>
    <hr>
</div>
<div class="content">
    <form class="form-escola" [formGroup]="escolaForm">
        <mat-form-field class="input input-nome">
            <mat-label>Nome</mat-label>
            <input matInput formControlName="nome" required placeholder="Informe o nome da escola">
        </mat-form-field>

    </form>

    <div class="action-buttons">
        <button mat-button mat-dialog-close>Cancelar</button>
        <button matButton="filled" [disabled]="!escolaForm.valid" (click)="onSubmit()">Salvar</button>
    </div>
</div>
