<div class="header">
    <h2>Dados do Curso</h2>
    <hr>
</div>
<div class="content">
    <form class="form-curso" [formGroup]="cursoForm">
        <input type="hidden" formControlName="id">
        <mat-form-field class="input input-nome">
            <mat-label>Nome</mat-label>
            <input matInput formControlName="nome" required placeholder="Informe o nome do curso">
        </mat-form-field>

    </form>

    <div class="action-buttons">
        <button mat-button mat-dialog-close>Cancelar</button>
        <button matButton="filled" [disabled]="!cursoForm.valid" (click)="onSubmit()">Salvar</button>
    </div>
</div>
