<app-dynamic-table
    [data]="data()"
    [filter]="filter"
    [columns]="tableColumns"
    [showActions]="true">

    <!-- Template de ações -->
    <ng-template #actionsTemplate let-row>
        <button mat-icon-button color="primary" (click)="$event.stopPropagation(); openEscolaDetalhesDialog(row)" matTooltip="Editar">
            <mat-icon>visibility</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="$event.stopPropagation(); openConfirmDeleteDialog(row)" matTooltip="Excluir">
            <mat-icon>delete</mat-icon>
        </button>
    </ng-template>
</app-dynamic-table>
